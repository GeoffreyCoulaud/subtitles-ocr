[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitles-ocr"
version = "0.1.0"
description = "Hardcoded subtitle extractor for anime — outputs .ass files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=11.0",
    "pydantic>=2.0",
    "click>=8.0",
    "tqdm>=4.67.3",
    "openai>=2.33.0",
    "pyyaml>=6.0.3",
    "numpy>=2.4.6",
    "httpx>=0.28.1",
    "silero-vad>=6.2.1",
    "onnxruntime>=1.26.0",
    "opencv-contrib-python-headless>=4.13.0.92",
    "scipy>=1.17.1",
    "paddleocr>=2.10.0",
    "paddlepaddle>=3.3.1",
]

[project.scripts]
subtitles-ocr = "subtitles_ocr.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["main*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
